<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Backlog" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Backlog — SA firearm tracker</title>
    <meta
      name="description"
      content="Backlog tracks SAPS firearm licence applications and your digital safe of approved firearms."
    />
    <meta property="og:title" content="Backlog — SA firearm tracker" />
    <meta
      property="og:description"
      content="Track SAPS application status, working-day aging, and FCA section expiry countdowns."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Apply persisted theme before first paint to prevent flash.
      (function () {
        try {
          var t = localStorage.getItem("backlog_theme");
          if (!t) {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.classList.toggle("dark", t === "dark");
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
